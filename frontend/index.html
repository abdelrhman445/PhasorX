<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PhasorX — منصة عربية لتصميم ومحاكاة دوائر التحكم الكلاسيك: كونتاكتورات، ريلايهات، تايمرات وموتورات على كانفاس تفاعلي."
    />
    <meta name="theme-color" content="#060a13" />
    <title>PhasorX | محاكي دوائر التحكم الكهربائية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
      <style>
      #splash {
        position: fixed; inset: 0; z-index: 999;
        display: grid; place-items: center;
        background: #060a13;
        transition: opacity 0.5s ease, visibility 0s linear 0.55s;
      }
      #splash.done { opacity: 0; visibility: hidden; }
      .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: splash-in 0.5s cubic-bezier(0.22,1,0.36,1) both; }
      .splash-badge {
        width: 58px; height: 58px; border-radius: 16px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #fbbf24, #f59e0b 60%, #fb923c);
        box-shadow: 0 10px 32px -8px rgba(245,158,11,0.55);
      }
      .splash-badge svg { width: 55%; height: 55%; }
      .splash-word {
        font-family: "Space Grotesk", "Cairo", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; color: #f3f6fc;
      }
      .splash-word span { color: #f59e0b; }
      .splash-bar { width: 120px; height: 3px; border-radius: 99px; background: #1d2942; overflow: hidden; }
      .splash-bar span {
        display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #fbbf24, #fb923c);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes splash-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-badge">
          <svg viewBox="0 0 48 48" fill="none" stroke="#1a1206" stroke-width="3.6" stroke-linecap="round">
            <circle cx="24" cy="24" r="14" />
            <path d="M24 24 28.7 19.3" stroke-width="4.2" />
            <path d="M33.33 14.67 31 21.52 26.48 17 Z" fill="#1a1206" stroke="none" />
            <circle cx="24" cy="24" r="2.1" fill="#1a1206" stroke="none" />
          </svg>
        </div>
        <div class="splash-word">Phasor<span>X</span></div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
